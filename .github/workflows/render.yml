name: Render Profile

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - run: node render.js

      - run: git add profile.png

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update profile image"
